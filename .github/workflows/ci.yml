name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          leanchecker: "false"
      - name: Verify Lean implementation contract and ABI
        working-directory: lean
        run: |
          lake build TamarinCI
          lake env leanchecker TamarinCI
          lake env lean Tests/SpecAudit.lean
          lake env lean Tests/ExistingSpecAudit.lean
          lake env lean Tests/WeightedComposition.lean
          lake env lean Tests/ACSystem.lean
          lake env lean Tests/ACRowElimination.lean
          lake env lean --run Tests/ACPivot.lean
          lake env lean Tests/WholeProblem.lean
          lake env lean Tests/FactoredUnification.lean
          lake env lean Tests/IndependentUnification.lean
          lake env lean Tests/FactorReplay.lean
          lake env lean Tests/GraphUnification.lean
          lake env lean Tests/ACColumnSupport.lean
          lake env lean Tests/ACMatchBags.lean
          lake env lean --run Tests/ACBagSearch.lean
          lake env lean --run Tests/ACBagAnswers.lean
          lake env lean --run Tests/ACBagPages.lean
          lake env lean --run Tests/ACSortedBagSearch.lean
          lake env lean Tests/ACTwoRowFeasibility.lean
          lake env lean Tests/ACLowRank.lean
          lake env lean Tests/AnswerProjection.lean
          lake env lean Tests/OperandRefinement.lean
          lake env lean Tests/OperandCounts.lean
          lake env lean --run Tests/OperandRowStress.lean
          lake env lean Tests/OperandUnification.lean
          lake env lean Tests/ProjectedOperands.lean
          lake env lean Tests/Residual.lean
          lake env lean Tests/XorSpecAudit.lean
          lake env lean --run Tests/XorVariants.lean
          lake env lean Tests/BackendContract.lean
          lake env lean Tests/FreshSubstitution.lean
          lake env lean Tests/TermEncoding.lean
          lake env lean Tests/WordEncoding.lean
          lake env lean Tests/Pairing.lean
          lake env lean Tests/CorrelatedVariantsAudit.lean
          lake env lean Tests/Rewriting.lean
          lake env lean Tests/StableDH.lean
          lake env lean Tests/DHProductUnique.lean
          lake env lean Tests/Bilinear.lean
          lake env lean --run Tests/DHTower.lean
          lake env lean --run Tests/DHExponent.lean
          lake env lean Tests/VariantJoin.lean
          lake env lean Tests/OpenNarrowing.lean
          lake env lean Tests/GroundNarrowing.lean
          lake env lean Tests/Matching.lean
          lake env lean Tests/FlatMatching.lean
          lake env lean Tests/SortedMatch.lean
          lake env lean Tests/OpenMatchSelect.lean
          lake env lean Tests/CompoundPartitions.lean
          lake env lean Tests/OpenMatch.lean
          lake env lean Tests/MatchOrder.lean
          lake env lean Tests/NestedTreeMatch.lean
          lake env lean Tests/CanonicalTree.lean
          lake env lean Tests/RecursiveACMatch.lean
          lake env lean --run Tests/MatchingStress.lean
          lake env lean --run Tests/CommonCancellation.lean
          lake env lean --run Tests/RigidAllocation.lean
          lake env lean --run Tests/Commutative.lean
          lake env lean --run Tests/SortClash.lean
          lake env lean Tests/IdentityTable.lean
          python3 Tests/check_audit.py
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Native-only operations without a Maude binary
        run: cargo test --profile ci -p tamarin-term --features lean-unification --test native_backend --test native_match_components -- --test-threads=1
      - name: Measure the public native backend against Lean-generated algebra queries
        run: cargo test --profile ci -p tamarin-term --features lean-unification --test spec_coverage -- --nocapture
      - name: Install Maude oracle
        run: |
          curl -sSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sudo mkdir -p /opt/maude
          sudo unzip -q /tmp/maude.zip -d /opt/maude
          sudo chmod +x /opt/maude/maude
      - name: Compare explicit native-only sessions with a separate Maude oracle
        run: cargo test --profile ci -p tamarin-term --features lean-unification --lib native_oracle_
        env:
          MAUDE_PATH: /opt/maude/maude
      - name: Native Lean bridge and differential tests
        run: cargo test --profile ci -p tamarin-term --features lean-unification --lib -- --test-threads=1
        env:
          MAUDE_PATH: /opt/maude/maude
          TAM_RS_VERIFY_LEAN_UNIFY: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protocol proof with native Lean dispatch
        run: |
          cargo test --profile ci -p tamarin-theory --features tamarin-term/lean-unification --lib natural_source_match_keeps_its_node_binding_and_first_alternative
          cargo test --profile ci -p tamarin-theory --features tamarin-term/lean-unification --lib restriction_guard_nested_ac_keeps_rigid_system_variables_and_time
          cargo test --profile ci -p tamarin-prover --features lean-unification --lib --test lean_unification --test native_backend
        env:
          MAUDE_PATH: /opt/maude/maude

  checks:
    runs-on: ubuntu-latest
    steps:
      # Exercise Cargo's automatic submodule initialization on a fresh checkout.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Keep Cargo.toml's compatibility claim honest without another runner.
      # The version is [workspace.package] rust-version, read via cargo
      # metadata so Cargo.toml stays its only source.
      - name: Install MSRV toolchain
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique
                     | if length == 1 then .[0]
                       else error("crates disagree on rust-version: \(.)") end')
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - name: MSRV check
        run: cargo +"$MSRV" check --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    env:
      # The ~44 integration-test binaries each link the full stack; lld
      # links them several times faster than the default bfd ld.
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      # Submodule: intruder-variant data the build include_str!'s.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lld
        run: command -v ld.lld >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq lld)
      # Graphviz: two tests run a real `dot`.  The first is the success-path
      # self-test in probe_reports.rs (the GraphViz block of the `test` mode).
      # The second is dot_tests.rs's lint of the DOT this port writes.  Both
      # panic instead of a skip when `dot` cannot run, and TAM_ALLOW_NO_DOT=1
      # opts out of the panic.  This step is therefore what keeps them from
      # failing the job.  A runner image that stops shipping graphviz then
      # fails the job instead of dropping both pins in silence.
      - name: Install Graphviz
        run: command -v dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
      # Same pinned Maude as the rs-parity job (see the comment there).
      - name: Install Maude 3.5.1
        run: |
          curl -sSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sudo mkdir -p /opt/maude
          sudo unzip -q /tmp/maude.zip -d /opt/maude
          sudo chmod +x /opt/maude/maude
      # MAUDE_PATH: every crate's maude-gated tests honour this env override.
      # Pin the test harness to this installation. Missing Maude fails tests
      # unless TAM_ALLOW_NO_MAUDE=1 explicitly opts into skipping them.
      # PATH too: the port itself resolves a bare `maude` the way HS does
      # (/usr/local/bin, /usr/bin, then $PATH) and does NOT read MAUDE_PATH,
      # so tests that drive the real CLI paths — `--version`'s ensureMaude
      # probe in run::tests::version_returns_zero — need maude reachable
      # by name.
      # profile ci = release opt without fat-LTO links / serial codegen (see
      # Cargo.toml) — the release profile re-runs whole-graph LTO at every
      # test-binary link, which dwarfs everything else this job does.
      - run: export PATH="/opt/maude:$PATH" && cargo test --profile ci --workspace
        env:
          MAUDE_PATH: /opt/maude/maude
      - name: GUI browser regression
        run: |
          node --test scripts/test_cancel_ui.mjs
          npm install --prefix target/gui-browser-test --no-audit --no-fund --no-save playwright@1.63.0
          target/gui-browser-test/node_modules/.bin/playwright install --with-deps chromium
          export PATH="/opt/maude:$PATH"
          node scripts/test_gui.mjs
      # The bypass path deliberately recomputes sources per context. Keep it
      # in a separate process: environment-gate changes are not thread-safe
      # inside the parallel Rust test harness.
      - name: Source-cache bypass
        run: export PATH="/opt/maude:$PATH" && cargo test --profile ci -p tamarin-theory prove::tests --lib
        env:
          MAUDE_PATH: /opt/maude/maude
          TAM_RS_NO_SOURCE_CACHE: "1"
      # Wellformedness fixture roster, port side (~2s; the step above has
      # already built this example). `cargo test` runs the same 18 fixtures
      # through tamarin-theory's wellformedness fixture tests. The one thing
      # this runner adds is its EMPTY_RUST_EXPECTATION_ALLOWLIST, and that
      # harness has no equivalent of it.  A fixture whose every expected topic
      # is post-elaboration must appear in that list with a reason.  A listed
      # fixture whose expectation set stops being empty must come off the
      # list.  Without this check, a new post-elaboration-only fixture joins
      # the roster while the tests/ harness still passes.  Such a fixture
      # asserts nothing beyond "the file parses" on the port side.
      #
      # `--no-tamarin` is required, not a convenience.  The runner's third
      # step shells out to the pinned `tamarin-prover`, which no CI job builds.
      # The fixtures' differential against the oracle therefore stays a
      # milestone gate.  Steps 1 and 2 need only the port and the committed
      # tests/wellformedness_fixtures/expected.txt.
      - name: Wellformedness fixture roster
        run: cargo run --profile ci -p tamarin-theory --example wellformedness_fixtures -- --no-tamarin
      # The corners no corpus theory reaches (~5s).  Only the port runs here:
      # the oracle side is the committed capture under
      # scripts/divergence_fixtures/expected/, so this needs the submodule
      # (fixtures + the pin the check compares against) and maude — both
      # already provisioned above — and no Haskell build.  The check refuses to
      # run when expected/oracle_rev is not the current pin, so a submodule
      # bump that lands without re-running capture.sh fails CI loudly.
      - name: Divergence fixtures
        run: |
          # The port probes /usr/local/bin/maude and /usr/bin/maude, then lets
          # $PATH resolve a bare `maude`; it does NOT read MAUDE_PATH.
          export PATH="/opt/maude:$PATH"
          cargo build --profile ci --bin tamarin-rs
          # Absolute: check.sh runs the binary from the fixture directory.
          RS_PATH="$PWD/target/ci/tamarin-rs" scripts/divergence_fixtures/check.sh

  rs-parity:
    runs-on: ubuntu-latest
    steps:
      # Submodule: corpus theories to prove + intruder-variant data the build
      # include_str!'s.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The focused harness tests fingerprint Graphviz as part of web-cache
      # producer identity; keep that dependency explicit in this job too.
      - name: Install Graphviz
        run: command -v dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
      # Pinned Maude — must match the '# maude:' header in
      # scripts/ci_ref_fast.tsv (rs_ref_check.sh enforces this; unifier
      # enumeration order can change between Maude versions).  The release zip
      # ships prelude.maude next to the binary, so the dir stays together.
      - name: Install Maude 3.5.1
        run: |
          curl -sSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sudo mkdir -p /opt/maude
          sudo unzip -q /tmp/maude.zip -d /opt/maude
          sudo chmod +x /opt/maude/maude
          echo /opt/maude >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: Parity harness regression tests
        run: python3 scripts/test_web_harness.py
      # Prove-output parity: this branch's binary vs the committed reference
      # of main's outputs (scripts/ci_ref_fast.tsv over
      # scripts/parity_corpus_fast.txt).  On DIFF: reproduce locally with
      # scripts/rs_vs_rs_diff.sh.  After a DELIBERATE output change or a
      # submodule bump, regenerate the reference on a trusted build of main
      # (generate refuses to run without a certifying oracle gate result):
      #   scripts/rs_ref_check.sh generate --certified-by <gate-results>
      - run: scripts/rs_ref_check.sh check
