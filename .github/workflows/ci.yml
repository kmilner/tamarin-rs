name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Exercise Cargo's automatic submodule initialization on a fresh checkout.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Read the shared workspace MSRV through Cargo metadata.
      - name: Install MSRV toolchain
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique
                     | if length == 1 then .[0]
                       else error("crates disagree on rust-version: \(.)") end')
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - name: MSRV check
        run: cargo +"$MSRV" check --workspace --all-targets

  test:
    runs-on: ubuntu-latest
    env:
      # lld speeds up linking the integration-test binaries.
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      # Submodule: intruder-variant data the build include_str!'s.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lld
        run: command -v ld.lld >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq lld)
      # Graphviz-dependent tests require dot; TAM_ALLOW_NO_DOT=1 explicitly
      # skips them when Graphviz is unavailable.
      - name: Install Graphviz
        run: command -v dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
      # Same pinned Maude as the rs-parity job (see the comment there).
      - name: Install Maude 3.5.1
        run: |
          curl -sSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sudo mkdir -p /opt/maude
          sudo unzip -q /tmp/maude.zip -d /opt/maude
          sudo chmod +x /opt/maude/maude
      # MAUDE_PATH pins test helpers; PATH also makes Maude available to CLI
      # probes, which do not read MAUDE_PATH. Missing Maude fails tests unless
      # TAM_ALLOW_NO_MAUDE=1 explicitly permits skipping them. The ci profile
      # optimizes tests without the release profile's per-binary fat-LTO cost.
      - run: export PATH="/opt/maude:$PATH" && cargo test --profile ci --workspace
        env:
          MAUDE_PATH: /opt/maude/maude
      - name: GUI browser regression
        run: |
          node --test scripts/test_cancel_ui.mjs
          npm install --prefix target/gui-browser-test --no-audit --no-fund --no-save playwright@1.63.0
          target/gui-browser-test/node_modules/.bin/playwright install --with-deps chromium
          export PATH="/opt/maude:$PATH"
          node scripts/test_gui.mjs
      # The bypass path deliberately recomputes sources per context. Keep it
      # in a separate process: environment-gate changes are not thread-safe
      # inside the parallel Rust test harness.
      - name: Source-cache bypass
        run: export PATH="/opt/maude:$PATH" && cargo test --profile ci -p tamarin-theory prove::tests --lib
        env:
          MAUDE_PATH: /opt/maude/maude
          TAM_RS_NO_SOURCE_CACHE: "1"
      # Check EMPTY_RUST_EXPECTATION_ALLOWLIST: fixtures with no Rust-side
      # topics must be listed with a reason; fixtures with topics must not be.
      # --no-tamarin uses committed expected topics because CI does not build
      # Haskell. The oracle comparison runs separately as a milestone gate.
      - name: Wellformedness fixture roster
        run: cargo run --profile ci -p tamarin-theory --example wellformedness_fixtures -- --no-tamarin
      # Compare focused fixtures against committed oracle captures, requiring
      # Maude and the submodule but no Haskell build. The captured oracle_rev
      # must match the submodule pin.
      - name: Divergence fixtures
        run: |
          # The port probes /usr/local/bin/maude and /usr/bin/maude, then lets
          # $PATH resolve a bare `maude`; it does NOT read MAUDE_PATH.
          export PATH="/opt/maude:$PATH"
          cargo build --profile ci --bin tamarin-rs
          # Absolute: check.sh runs the binary from the fixture directory.
          RS_PATH="$PWD/target/ci/tamarin-rs" scripts/divergence_fixtures/check.sh

  rs-parity:
    runs-on: ubuntu-latest
    steps:
      # Submodule: corpus theories to prove + intruder-variant data the build
      # include_str!'s.
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Prepare fixture sources, applying this branch's patch series if any.
      # Only sources are needed: CI uses committed oracle hashes and
      # upstream command assertions, without compiling Haskell.
      - run: ./setup.sh testing-sources
      - run: rustup update stable --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The focused harness tests fingerprint Graphviz as part of web-cache
      # producer identity; keep that dependency explicit in this job too.
      - name: Install Graphviz
        run: command -v dot >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq graphviz)
      # rs_ref_check.sh requires the Maude version in ci_ref_fast.tsv because
      # unifier ordering depends on it. Keep prelude.maude beside the binary.
      - name: Install Maude 3.5.1
        run: |
          curl -sSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          sudo mkdir -p /opt/maude
          sudo unzip -q /tmp/maude.zip -d /opt/maude
          sudo chmod +x /opt/maude/maude
          echo /opt/maude >> "$GITHUB_PATH"
      - run: cargo build --release
      - name: Parity harness regression tests
        run: scripts/test.sh harness
      - name: Upstream command regressions (all supported scenarios)
        run: scripts/test.sh regressions
      # Compare prove output with oracle-certified hashes in ci_ref_fast.tsv
      # for parity_corpus_fast.txt. Reproduce DIFFs with rs_vs_rs_diff.sh.
      # Reference updates require a certifying oracle gate result:
      #   scripts/rs_ref_check.sh generate --certified-by <gate-results>
      - run: scripts/rs_ref_check.sh check
