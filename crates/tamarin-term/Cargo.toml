[package]
name = "tamarin-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Term language for the Tamarin prover (Rust port)."

[features]
# Build and statically link the experimental, proof-checked Lean backend.
lean-unification = ["dep:tamarin-algebra-sys"]

[[example]]
name = "lean_unification_bench"
required-features = ["lean-unification"]

[[example]]
name = "repeated_variable_bench"
required-features = ["lean-unification"]

[dependencies]
tamarin-algebra-sys = { git = "https://github.com/kmilner/tamarin-algebra.git", rev = "aa69fce7258cab5af6b32509d88b07e794e82b2f", optional = true }
tamarin-utils = { workspace = true }
parking_lot = "0.13"
rustc-hash = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
tamarin-test-support = { workspace = true }
rayon = { workspace = true }

[build-dependencies]
tamarin-build = { workspace = true }

[lints]
workspace = true
